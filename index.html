<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>名片掃描器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>名片掃描器 <span id="version">v2.3</span></h1>
<div style="position:relative; display:inline-block;">
  <video id="preview" autoplay playsinline style="width:400px;background:#000;"></video>
  <div id="guide" style="
    position:absolute;
    top:20%; left:20%;
    width:60%; height:60%;
    border:2px dashed #fff;
    pointer-events:none;
    box-sizing:border-box;
  "></div>
</div>
<br>
<button id="captureBtn">拍照</button>
<div id="result" style="margin-top:1em;"></div>
<a id="downloadLink" download="contact.vcard" style="display:none;">下載 vCard</a>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5"></script>
<script src="script.js"></script>
</body>
</html>
